name: Build Jarvis Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $iconFlag = @()
          if (Test-Path "icon.ico") {
            $iconFlag = @("--icon=icon.ico")
          }

          pyinstaller --clean --noconfirm --onefile --windowed --name Jarvis @iconFlag `
            --hidden-import=comtypes.stream `
            --hidden-import=comtypes.client `
            --hidden-import=pycaw.pycaw `
            --hidden-import=speech_recognition `
            --collect-all pyttsx3 `
            --collect-all edge_tts `
            --hidden-import=playsound `
            jarvis_system_agent_fixed.py

          if (!(Test-Path "dist\Jarvis.exe")) {
            throw "PyInstaller не создал dist\Jarvis.exe"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Find Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          )

          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }

          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files*" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $iscc) {
            throw "ISCC.exe не найден после установки Inno Setup"
          }

          Write-Host "Найден Inno Setup compiler: $iscc"
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify installer inputs
        shell: pwsh
        run: |
          if (!(Test-Path "setup.iss")) {
            throw "В репозитории отсутствует setup.iss"
          }
          if (!(Test-Path "dist\Jarvis.exe")) {
            throw "В репозитории отсутствует dist\Jarvis.exe"
          }

      - name: Compile installer
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.path }}" "/Q" "setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup завершился с кодом $LASTEXITCODE"
          }

          if (!(Test-Path "Output\JarvisSetup.exe")) {
            throw "Inno Setup не создал Output\JarvisSetup.exe"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JarvisSetup
          path: Output/JarvisSetup.exe
          if-no-files-found: error
