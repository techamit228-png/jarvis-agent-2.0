name: Build Jarvis Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $iconFlag = @()
          if (Test-Path "icon.ico") { $iconFlag = @("--icon=icon.ico") }
          pyinstaller --onefile --name Jarvis @iconFlag `
            --hidden-import=comtypes.stream `
            --hidden-import=pycaw.pycaw `
            --hidden-import=speech_recognition `
            --collect-all pyttsx3 `
            --collect-all edge_tts `
            --hidden-import=playsound `
            jarvis_system_agent_fixed.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload installer as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisSetup
          path: Output\JarvisSetup.exe
