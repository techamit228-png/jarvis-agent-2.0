name: Build Jarvis Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $iconFlag = @()
          if (Test-Path "icon.ico") {
            $iconFlag = @("--icon=icon.ico")
          }

          pyinstaller --clean --onefile --name Jarvis @iconFlag `
            --hidden-import=comtypes.stream `
            --hidden-import=pycaw.pycaw `
            --hidden-import=speech_recognition `
            --collect-all pyttsx3 `
            --collect-all edge_tts `
            --hidden-import=playsound `
            jarvis_system_agent_fixed.py

          if (-not (Test-Path "dist\Jarvis.exe")) {
            throw "PyInstaller не создал dist\Jarvis.exe"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Create installer script
        shell: pwsh
        run: |
          @'
          [Setup]
          AppId={{8B4B8B4D-6C7E-4E1A-9B7B-9E8E2D2A7A11}
          AppName=JARVIS
          AppVersion=1.0.0
          AppPublisher=JARVIS
          DefaultDirName={autopf}\JARVIS
          DefaultGroupName=JARVIS
          OutputDir=Output
          OutputBaseFilename=JarvisSetup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayName=JARVIS

          [Files]
          Source: "dist\Jarvis.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\JARVIS"; Filename: "{app}\Jarvis.exe"
          Name: "{autodesktop}\JARVIS"; Filename: "{app}\Jarvis.exe"

          [Run]
          Filename: "{app}\Jarvis.exe"; Description: "Запустить JARVIS"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path "setup.iss" -Encoding UTF8

          if (-not (Test-Path "setup.iss")) {
            throw "Не удалось создать setup.iss"
          }

      - name: Find Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )

          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $compiler) {
            $compiler = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}","${env:ProgramFiles}" `
              -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $compiler) {
            throw "ISCC.exe не найден после установки Inno Setup"
          }

          "compiler=$compiler" >> $env:GITHUB_OUTPUT
          Write-Host "Найден Inno Setup: $compiler"

      - name: Compile installer
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.compiler }}" "setup.iss"

          if (-not (Test-Path "Output\JarvisSetup.exe")) {
            throw "Inno Setup не создал Output\JarvisSetup.exe"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JarvisSetup
          path: Output\JarvisSetup.exe
